\* Exhaustive in ~1 minute. Three nodes are exhaustively intractable (>15M
\* states); simulate them instead (~2-4 minutes, with 2 or 3 workers):
\*   tlc2.TLC -simulate num=10000 -depth 200 -workers 8 UFSCC
\* after changing Nodes to {1, 2, 3}.
CONSTANT Nodes = {1, 2}
CONSTANT Workers = {w1, w2}
SPECIFICATION Spec
INVARIANTS Correct NoError
PROPERTIES SccSafety Terminates Returns
\* The search stops at the first violation.
CHECK_DEADLOCK FALSE
